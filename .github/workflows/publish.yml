name: publish

# Publishes to PyPI when a tag like v0.1.0 is pushed, using PyPI Trusted Publishing: the job proves
# its identity to PyPI with a short-lived OpenID Connect token, so no PyPI API token is stored in
# this repository. The project must have a trusted publisher on PyPI naming this repository, this
# workflow file (publish.yml) and the environment below (release). Nothing else can publish.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The tag, the version and the notes agree
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/esportsodds/_version.py)"
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match the package version '$version'" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$version]' section: rename [Unreleased] and date it" >&2
            exit 1
          fi
          if grep -q 'not yet on PyPI' README.md; then
            echo "README.md still says the package is not yet on PyPI: remove the pre-release note" >&2
            exit 1
          fi

      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          mypy
          pytest

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      url: https://pypi.org/project/esportsodds/
    permissions:
      id-token: write # lets this job ask PyPI to trust it (Trusted Publishing); nothing is stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
