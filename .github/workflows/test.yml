name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: The source distribution holds the library, its tests and its licence
        run: |
          tar tzf dist/*.tar.gz | sed 's|^[^/]*/||' | sort > sdist.txt
          cat sdist.txt
          grep -qx 'LICENSE' sdist.txt
          grep -qx 'README.md' sdist.txt
          grep -qx 'src/esportsodds/py.typed' sdist.txt
          grep -q '^tests/test_client.py$' sdist.txt
      - name: The wheel holds the package and nothing else
        run: |
          python3 - dist/*.whl <<'PY'
          import sys
          import zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          print("\n".join(names))
          stray = [n for n in names if not n.startswith(("esportsodds/", "esportsodds-"))]
          needed = ("esportsodds/__init__.py", "esportsodds/py.typed")
          missing = [n for n in needed if n not in names]
          if stray or missing:
              sys.exit(f"stray files {stray}; missing files {missing}")
          PY
